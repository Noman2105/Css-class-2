
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-card">

        <span class="discount">Save: 5,800৳ (-16%)</span>

        <div class="product-image">
            <img src="./lab2test.png" alt="Desktop PC">
        </div>

        <div class="product-info">
            <h6>AMD Ryzen 3 2200G Desktop PC</h6>

            <div class="price">
                <span class="new-price">30,999৳</span>
                <span class="old-price">(36,799৳)</span>
            </div>
        </div>

    </div>

</body>
</html>
